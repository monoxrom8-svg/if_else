{# Мобильное меню и нижняя навигация кабинета соискателя #}
<div id="mobile-menu"
     class="lg:hidden hidden fixed inset-0 z-30"
     style="background:rgba(15,23,42,0.5);backdrop-filter:blur(3px);"
     onclick="toggleMobileMenu()">
  <div class="absolute inset-x-0 overflow-y-auto"
       style="top:var(--site-header-total,4rem);max-height:calc(100dvh - var(--site-header-total,4rem));"
       onclick="event.stopPropagation()">
    <div class="bg-white px-5 pt-4 pb-4 mb-4 border-b border-slate-100">
      <div class="font-bold text-[#1E293B] text-base truncate">{{ user.display_name|default:user.username }}</div>
      <div class="text-xs text-slate-400 mt-1">Соискатель · {{ profile_completeness }}% профиля</div>
    </div>
    <div class="mx-4 mb-6 bg-white rounded-3xl shadow-xl overflow-hidden border border-slate-100">
      <nav>
        <button type="button" onclick="mobileNav('overview')" id="mnav-overview"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 bg-blue-50/60">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-blue-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#2563EB" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
          </span>
          <span class="text-sm font-semibold text-[#2563EB] flex-1">Обзор</span>
        </button>
        <button type="button" onclick="mobileNav('profile')" id="mnav-profile"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Мой профиль</span>
        </button>
        <button type="button" onclick="mobileNav('activity')" id="mnav-activity"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Активность</span>
          {% if apps_total %}<span class="text-xs font-bold text-[#2563EB]">{{ apps_total }}</span>{% endif %}
        </button>
        <button type="button" onclick="mobileNav('recommended')" id="mnav-recommended"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Рекомендации</span>
          {% if recommended %}<span class="text-xs font-bold text-green-600">{{ recommended|length }}</span>{% endif %}
        </button>
        <button type="button" onclick="mobileNav('contacts')" id="mnav-contacts"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Контакты</span>
        </button>
        <button type="button" onclick="mobileNav('inbox')" id="mnav-inbox"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-b border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Входящие</span>
          {% if unread_count %}<span class="text-xs font-bold text-red-500">{{ unread_count }}</span>{% endif %}
        </button>
        <button type="button" onclick="mobileNav('settings')" id="mnav-settings"
                class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Настройки</span>
        </button>
        <button type="button" onclick="if(window.CW){CW.showInbox();CW.open();}closeMobileMenu();" class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left border-t border-slate-100 hover:bg-slate-50">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Сообщения</span>
        </button>
        <a href="/" class="mobile-nav-item w-full flex items-center gap-4 px-5 py-[15px] text-left hover:bg-slate-50 no-underline">
          <span class="w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0 bg-slate-100">
            <svg class="w-[18px] h-[18px]" fill="none" stroke="#475569" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
          </span>
          <span class="text-sm font-medium text-[#334155] flex-1">Карта вакансий</span>
        </a>
      </nav>
    </div>
    <div class="mx-4 mb-8">
      <a href="{% url 'tramplin:logout' %}" class="w-full flex items-center justify-center gap-2 px-5 py-3 rounded-2xl bg-white border border-red-100 text-red-600 text-sm font-semibold shadow-sm">Выйти</a>
    </div>
  </div>
</div>

<nav class="lg:hidden fixed bottom-0 inset-x-0 z-30 bg-white border-t border-slate-200 shadow-[0_-2px_12px_rgba(0,0,0,0.06)] flex items-stretch h-16">
  <button type="button" data-section="overview" onclick="showSection('overview');closeMobileMenu()"
          class="bottom-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5">
    <span class="bnav-icon text-[#2563EB]">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    </span>
    <span class="bnav-label text-[10px] font-semibold text-[#2563EB]">Обзор</span>
  </button>
  <button type="button" data-section="activity" onclick="showSection('activity');closeMobileMenu()"
          class="bottom-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5">
    <span class="bnav-icon text-slate-400 relative">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
      {% if apps_total %}<span class="absolute -top-1 -right-1 w-4 h-4 rounded-full bg-[#2563EB] text-white text-[9px] font-bold flex items-center justify-center">{{ apps_total }}</span>{% endif %}
    </span>
    <span class="bnav-label text-[10px] font-medium text-slate-400">Отклики</span>
  </button>
  <button type="button" data-section="recommended" onclick="showSection('recommended');closeMobileMenu()"
          class="bottom-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5">
    <span class="bnav-icon text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
    </span>
    <span class="bnav-label text-[10px] font-medium text-slate-400">Подбор</span>
  </button>
  <button type="button" onclick="toggleMobileMenu()"
          class="bottom-nav-btn flex-1 flex flex-col items-center justify-center gap-0.5">
    <span class="bnav-icon text-slate-400">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </span>
    <span class="bnav-label text-[10px] font-medium text-slate-400">Ещё</span>
  </button>
</nav>
