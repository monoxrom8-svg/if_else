<aside class="hidden lg:block w-72 flex-shrink-0">
  <div class="sticky top-6 w-full">
    <div class="bg-white rounded-3xl shadow-lg border border-slate-100 overflow-hidden">
      <div class="px-5 pt-5 pb-4 border-b border-slate-100">
        <div class="font-bold text-[15px] text-[#1E293B] truncate">{{ user.display_name|default:user.username }}</div>
        <div class="flex flex-wrap gap-1.5 mt-2">
          <span class="inline-flex items-center gap-1 text-[11px] font-semibold px-2.5 py-[3px] rounded-full bg-slate-100 text-slate-600">Соискатель</span>
          {% if user.is_profile_public %}
          <span class="networking-badge text-[10px]"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span> Нетворкинг</span>
          {% endif %}
        </div>
        <div class="mt-3 px-1">
          <div class="flex justify-between text-[10px] font-semibold text-slate-500 mb-1">
            <span>Профиль</span><span class="text-[#2563EB]">{{ profile_completeness }}%</span>
          </div>
          <div class="h-1.5 bg-slate-100 rounded-full overflow-hidden">
            <div class="h-full bg-[#2563EB] rounded-full" style="width:{{ profile_completeness }}%"></div>
          </div>
        </div>
      </div>
      <nav class="flex flex-col gap-0.5 px-3 py-3">
        <button type="button" onclick="showSection('overview')" id="nav-overview" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg></div>
          Обзор
        </button>
        <button type="button" onclick="showSection('recommended')" id="nav-recommended" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>
          Рекомендации
          {% if recommended %}<span class="ml-auto text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full font-semibold">{{ recommended|length }}</span>{% endif %}
        </button>
        <button type="button" onclick="showSection('activity')" id="nav-activity" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg></div>
          Активность
          {% if apps_total %}<span class="ml-auto text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">{{ apps_total }}</span>{% endif %}
        </button>
        <button type="button" onclick="showSection('profile')" id="nav-profile" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg></div>
          Мой профиль
        </button>
        <button type="button" onclick="showSection('contacts')" id="nav-contacts" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
          Контакты
          {% if my_contacts.count or pending_requests %}<span class="ml-auto text-xs bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-semibold">{% if pending_requests %}{{ pending_requests|length }}+{% endif %}{{ my_contacts.count }}</span>{% endif %}
        </button>
        <button type="button" onclick="showSection('inbox')" id="nav-inbox" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/></svg></div>
          Входящие
          {% if unread_count %}<span class="ml-auto text-xs bg-red-100 text-red-600 px-2 py-0.5 rounded-full font-semibold">{{ unread_count }}</span>{% endif %}
        </button>
        <button type="button" onclick="showSection('settings')" id="nav-settings" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg></div>
          Настройки
        </button>
        <button type="button" onclick="if(window.CW){CW.showInbox();CW.open();}" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg></div>
          Сообщения
        </button>
        <a href="/" class="nav-item">
          <div class="nav-icon"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg></div>
          Карта вакансий
        </a>
      </nav>
      <div class="px-3 pb-3">
        <a href="{% url 'tramplin:public_profiles' %}?is_mentor=true"
           class="flex items-center justify-center gap-2 w-full px-3 py-2.5 rounded-xl text-sm font-semibold text-[#2563EB] border border-[#BFDBFE] bg-[#EFF6FF] hover:bg-[#DBEAFE] transition-colors">
          Менторы
        </a>
      </div>
      <div class="px-3 pb-4 pt-1 border-t border-slate-100">
        <a href="{% url 'tramplin:logout' %}" class="nav-item" style="color:#DC2626;">
          <div class="nav-icon" style="background:#FEF2F2;"><svg class="w-4 h-4" fill="none" stroke="#DC2626" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg></div>
          Выйти
        </a>
      </div>
    </div>
  </div>
</aside>
