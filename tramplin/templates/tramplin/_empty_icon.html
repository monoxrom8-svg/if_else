{# Пустое состояние: {% include "tramplin/_empty_icon.html" with icon="inbox" %} #}
{# icon: inbox | search | chat | clipboard | map-pin | mail #}
{# size: lg (default) | sm  ·  tone: blue (default) | slate #}
<div class="flex items-center justify-center mx-auto {% if size == 'sm' %}w-9 h-9 rounded-xl mb-1{% else %}w-12 h-12 rounded-2xl mb-3{% endif %}"
     style="{% if tone == 'slate' %}background:#F1F5F9;border:1px solid #E2E8F0;{% else %}background:#EFF6FF;border:1px solid #BFDBFE;{% endif %}">
  <svg class="{% if size == 'sm' %}w-5 h-5{% else %}w-6 h-6{% endif %}" fill="none"
       stroke="{% if tone == 'slate' %}#64748B{% else %}#2563EB{% endif %}"
       stroke-width="1.75" viewBox="0 0 24 24" aria-hidden="true">
    {% if icon == "search" %}
    <circle cx="11" cy="11" r="8"/><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35"/>
    {% elif icon == "chat" %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
    {% elif icon == "clipboard" %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/>
    {% elif icon == "map-pin" %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
    {% elif icon == "mail" %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
    {% else %}
    <path stroke-linecap="round" stroke-linejoin="round" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
    {% endif %}
  </svg>
</div>
